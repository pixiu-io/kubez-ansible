default:
  # 自动创建指定模型的数据库表结构，不会更新已存在的数据库表
  auto_migrate: true

  # jwt 签名的 key（必填）：release 模式下为空或仍为示例值将拒绝启动，
  # 请设置强随机值，生成方式: openssl rand -hex 32
  jwt_key: ""

  # 超级管理初始化用户名；密码留空时首次启动自动生成随机强密码并输出到启动日志（请及时修改）
  # 生产环境必须设置强口令，禁止使用任何示例/默认口令
  admin_user: admin
  admin_password: ""

# 数据库地址信息, 根据实际情况配置
# 生产环境必须改为强口令，数据库不得暴露公网
# 密码须与 docker-compose.yaml 中 MYSQL_ROOT_PASSWORD 的取值保持一致
mysql:
  host: mysql # 数据库的ip
  user: root
  password: change-me-strong-password
  port: 3306
  name: pixiu
