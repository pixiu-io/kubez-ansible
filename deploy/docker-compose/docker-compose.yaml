services:
  mysql:
    image: ccr.ccs.tencentyun.com/pixiucloud/mysql:5.7
    container_name: mysql
    restart: always
#    ports:
#      - 3306:3306
    environment:
      # 必须显式传入强口令启动，例如: MYSQL_ROOT_PASSWORD='<强口令>' docker-compose up -d
      # 未设置时 compose 直接报错，避免沿用任何示例/默认口令；数据库不得暴露公网
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?please-set-strong-password}
      MYSQL_DATABASE: "pixiu"
    volumes:
      - ./mysql/data:/var/lib/mysql

  pixiu:
    image: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:v2.0.2-beta.1
    container_name: pixiu
    restart: always
    ports:
      - 8080:80
    depends_on:
      - mysql
    volumes:
      - /etc/pixiu:/etc/pixiu
      - /var/run/docker.sock:/var/run/docker.sock
  
