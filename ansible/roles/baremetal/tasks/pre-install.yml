---
- name: Gather facts
  setup:

- name: Check the network nics for all nodes
  debug:
    msg: >-
      检测到主机 {{ inventory_hostname }} 的网卡列表中不存在网卡 {{ network_interface }}，请确认 /etc/kubez/globals.yml 的网卡配置。
  failed_when: true
  when:
    - network_interface not in hostvars[inventory_hostname]['ansible_interfaces']

- name: Checking certificate validity period configured
  fail:
    msg: >
      certificate_validity_period and ca_certificate_validity_period must be set
      when enable_certificate_period is enabled.
  when:
    - enable_certificate_period | bool
    - certificate_validity_period | string | length == 0 or ca_certificate_validity_period | string | length == 0

- name: Ensure localhost in /etc/hosts
  lineinfile:
    dest: /etc/hosts
    regexp: "^127.0.0.1.*"
    line: "127.0.0.1 localhost"
    state: present
  become: True

- name: Set system's hostname
  hostname:
    name: "{{ inventory_hostname }}"
  when:
    - set_hostname | bool

- name: Generate /etc/hosts for all of the nodes
  blockinfile:
    dest: /etc/hosts
    marker: "# {mark} ANSIBLE GENERATED HOSTS"
    block: |
        {% for host in groups['baremetal'] %}
        {% set api_interface = hostvars[host]['api_interface'] %}
        {{ hostvars[host]['ansible_' + api_interface]['ipv4']['address'] }} {{ hostvars[host]['ansible_hostname'] }}
        {% endfor %}
  become: True

- name: Change state of selinux
  selinux:
    policy: targeted
    state: "{{ selinux_state }}"
  become: true
  when:
    - change_selinux | bool
    - inventory_hostname in groups['baremetal']
    - ansible_distribution == 'Rocky' or
      ansible_distribution == 'openEuler' or
      ansible_distribution == 'AlmaLinux'

# Try to stop and disable delegated service,
# let it go when not exists.
- name: Disable RHEL-family firewalld and NetworkManager service
  service:
    name: "{{ item }}"
    state: stopped
    enabled: False
  failed_when: false
  loop: "{{ services_to_disabled }}"
  when:
    - inventory_hostname in groups['baremetal']
    - ansible_distribution == 'Rocky' or
      ansible_distribution == 'AlmaLinux'

- name: Disable openEuler firewalld service
  service:
    name: firewalld
    state: stopped
    enabled: False
  failed_when: false
  when:
    - inventory_hostname in groups['baremetal']
    - ansible_distribution == 'openEuler'

- name: Copy NetworkManager confs
  template:
    src: pixiu-canal.conf.j2
    dest: /etc/NetworkManager/conf.d/pixiu-canal.conf
  when:
    - inventory_hostname in groups['baremetal']
    - ansible_distribution == 'openEuler'
  notify:
    - Restart NetworkManager service

- name: Disable Ubuntu ufw service
  service:
    name: ufw
    state: stopped
    enabled: False
  failed_when: false
  when:
    - inventory_hostname in groups['baremetal']
    - ansible_distribution == 'Ubuntu'

# 判断是否自定义安装源
# 1. 使用官方源
- name: Prepare official repos for all of the nodes
  block:
    - name: Copy container runtime repos for kubernetes nodes
      template:
        src: "{{ item.src | find_custom_repo(dest=item.dest, repo_dir=repo_dir) }}"
        dest: "{{ item.dest }}"
      loop:
        - {"src": sources.list.j2, "dest": /etc/apt/sources.list, os: "Ubuntu"}
        - {"src": sources.list.debian.j2, "dest": /etc/apt/sources.list, os: "Debian"}
        - {"src": docker-ce.repo.j2, "dest": /etc/yum.repos.d/docker-ce.repo, os: "Rocky"}
        - {"src": kubernetes.repo.j2, "dest": /etc/yum.repos.d/kubernetes.repo, os: "Rocky"}
        - {"src": docker-ce.repo-openEuler.j2, "dest": /etc/yum.repos.d/docker-ce.repo, os: "openEuler"}
        - {"src": kubernetes.repo.j2, "dest": /etc/yum.repos.d/kubernetes.repo, os: "openEuler"}
        - {"src": docker-ce.repo-almalinux.j2, "dest": /etc/yum.repos.d/docker-ce.repo, os: "AlmaLinux"}
        - {"src": kubernetes.repo.j2, "dest": /etc/yum.repos.d/kubernetes.repo, os: "AlmaLinux"}
        - {"src": kubernetes.repo.j2, "dest": /etc/yum.repos.d/kubernetes.repo, os: "Kylin Linux Advanced Server"}
        - {"src": docker-ce.repo-openEuler.j2, "dest": /etc/yum.repos.d/docker-ce.repo, os: "Kylin Linux Advanced Server"}
      when:
        - ansible_distribution == item.os

    - name: Add kubernetes gpg
      gpg_key:
        url: 'https://mirrors.aliyun.com/kubernetes-new/core/stable/v{{ kube_base_version }}/deb/Release.key'
        output_path: "/etc/apt/keyrings/kubernetes-{{ kube_base_version }}-apt-keyring.gpg"
      when:
        - ansible_distribution == 'Ubuntu' or
          ansible_distribution == 'Debian'
        - release_bump

    - name: Add docker, and kubernetes gpgs
      apt_key:
        url: "{{ item }}"
      loop:
        - https://mirrors.aliyun.com/kubernetes/apt/doc/apt-key.gpg
        - https://mirrors.aliyun.com/docker-ce/linux/ubuntu/gpg
        - https://mirrors.huaweicloud.com/docker-ce/linux/debian/gpg
      when:
        - ansible_distribution == 'Ubuntu' or
          ansible_distribution == 'Debian'

    - name: Update kubernetes source before used
      apt:
        update_cache: yes
      when:
        - ansible_distribution == 'Ubuntu' or
          ansible_distribution == 'Debian'

    - name: Install epel-release packages
      yum:
        name: epel-release
        state: present
      when:
        - inventory_hostname in groups['kubernetes']
        - ansible_distribution == 'Rocky' or
          ansible_distribution == 'AlmaLinux'
  when:
    - not (enable_custom_repo | bool)

# 2. 使用自定义源（按包管理器分流，不绑定具体发行版名）
# apt: 备份 /etc/apt → /etc/apt.bak；清空 sources.list(.d)，分发为 pixiu.list
# yum/dnf: 备份 /etc/yum.repos.d → /etc/yum.repos.d.bak；清空后分发为 pixiu.repo
- name: Prepare custom repos for all of the nodes
  block:
    - name: Fail when package manager is unsupported for custom repo
      fail:
        msg: >-
          enable_custom_repo 仅支持 apt / yum / dnf，当前 ansible_pkg_mgr={{ ansible_pkg_mgr }}
          (ansible_distribution={{ ansible_distribution }})
      when:
        - ansible_pkg_mgr not in ['apt', 'yum', 'dnf']

    - name: Set custom repo path facts by package manager
      set_fact:
        _custom_repo_src: "{{ '/etc/apt' if ansible_pkg_mgr == 'apt' else '/etc/yum.repos.d' }}"
        _custom_repo_backup: "{{ '/etc/apt.bak' if ansible_pkg_mgr == 'apt' else '/etc/yum.repos.d.bak' }}"
        _custom_repo_dir: "{{ '/etc/apt/sources.list.d' if ansible_pkg_mgr == 'apt' else '/etc/yum.repos.d' }}"
        _custom_repo_name: "{{ 'pixiu.list' if ansible_pkg_mgr == 'apt' else 'pixiu.repo' }}"

    # creates 保证备份已存在时跳过，幂等
    - name: Backup original repo directory
      command: cp -a "{{ _custom_repo_src }}" "{{ _custom_repo_backup }}"
      args:
        creates: "{{ _custom_repo_backup }}"

    - name: Find existing files in repo directory
      find:
        paths: "{{ _custom_repo_dir }}"
        file_type: any
        hidden: true
      register: _custom_repo_files

    - name: Clear original repo files
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _custom_repo_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Remove apt sources.list
      file:
        path: /etc/apt/sources.list
        state: absent
      when:
        - ansible_pkg_mgr == 'apt'

    - name: Copy custom repo configs
      copy:
        src: "{{ custom_repo_config }}"
        dest: "{{ _custom_repo_dir }}/{{ _custom_repo_name }}"
        mode: "0644"

    - name: Update apt cache after custom repo
      apt:
        update_cache: yes
      when:
        - ansible_pkg_mgr == 'apt'
  when:
    - enable_custom_repo | bool
