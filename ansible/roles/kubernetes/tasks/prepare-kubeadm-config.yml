---
- name: Validate kubeadm certificate validity configuration
  assert:
    that:
      - kube_certificate_validity_period | string is match('^([0-9]+(ns|us|ms|s|m|h))+$') or kube_certificate_validity_period | string | length == 0
      - kube_ca_certificate_validity_period | string is match('^([0-9]+(ns|us|ms|s|m|h))+$') or kube_ca_certificate_validity_period | string | length == 0
    fail_msg: >-
      kubeadm certificate validity values must be empty or a duration such as
      8760h or 87600h.
  when: kube_release is version('1.31', '>=')
  delegate_to: localhost
  run_once: true

- name: Render kubeadm configuration for Kubernetes 1.31+
  template:
    src: "{{ playbook_dir }}/roles/baremetal/templates/kubeadm-config.yaml.j2"
    dest: /tmp/kubeadm-config.yaml
    mode: "0600"
  delegate_to: "{{ groups['kube-master'][0] }}"
  run_once: true
  when: kube_release is version('1.31', '>=')
