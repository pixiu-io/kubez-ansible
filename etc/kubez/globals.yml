---
#####################
# kubernetes options
#####################
# Enable an high availability kubernetes cluster.
#enable_kubernetes_ha: "no"

kube_release: 1.36.2

########################
# Add node options
########################
# Maintained by the user. add-node does not query a master for these values.
# 在集群的 master 节点上执行 kubeadm token create --print-join-command 命令获取
# 扩容节点集群的 kube-apiserver 地址，格式为 https://<kube-apiserver-ip>:6443
kube_apiserver_address: ""
# 扩容节点集群生成的 token，格式为 <token-id>.<token-secret>
kube_admin_token: ""
# 扩容节点集群的 CA 证书哈希值，格式为 :<hash-value>
kube_admin_token_ca_cert_hash: ""

cluster_cidr: "172.30.0.0/16"
service_cidr: "10.254.0.0/16"

# kube-proxy mode: iptables 或者 ipvs
#kube_proxy_mode: "iptables"

#Network interface is optional, the default value
#is eth0.
network_interface: "eth0"

# This should be a VIP, an unused IP on your network that will float between
# the hosts running keepalived for high-availability.
#kube_vip_address: ""

# Enable haproxy and keepalived
# This configuration is usually enabled when self-created VMs require high availability.
#enable_haproxy: "no"

# Listen port for kubernetes.
# 启用 haproxy + keepalived 时, 监听端口推荐使用 8443
#kube_vip_port: 6443

# Kubernetes network cni options
# Supported: flannel | calico | cilium (default: calico)
#cni: "calico"

# kubernetes 镜像仓库地址，默认阿里云，用户可根据实际情况配置
# 可使用 pixiu 社区镜像仓库：docker.io/pixiuio
image_repository: "registry.cn-hangzhou.aliyuncs.com/google_containers"

# 自定义镜像仓库
app_image_repository: "ccr.ccs.tencentyun.com/pixiucloud"

# 自定义 REPO 仓库
repo_dir: "/etc/kubez/repo"

###############
# Repo Options
###############
# 是否启用自定义源
enable_custom_repo: "no"
custom_repo_config: "/etc/kubez/pixiu"

###############
# Host Options
###############
# 自动重置节点的 hostname
# Rocky 系统不生效
#set_hostname: "yes"

# 需要停止并禁用的服务（按发行版列出，可自行增删；未列出的发行版不做处置）
# 本段整体覆盖 ansible/group_vars/all.yml 的同名兜底值（不按发行版逐键合并）
# 键须与 ansible_distribution 字面完全一致：Kylin 需写全串 "Kylin Linux Advanced Server"，写 "Kylin" 会静默失配
firewall_services_to_disabled:
  Rocky:
    - firewalld
  AlmaLinux:
    - firewalld
  openEuler:
    - firewalld
  Ubuntu:
    - ufw
  Debian:
    - ufw
  Kylin Linux Advanced Server:
    - firewalld

# 需要下发 NetworkManager CNI 豁免配置的发行版（NM 保持运行并忽略 cali*/flannel* 等 CNI 接口）
# 本段整体覆盖 ansible/group_vars/all.yml 的同名兜底值（列表整体替换，不合并）
networkmanager_conf_distributions:
  - Rocky
  - AlmaLinux
  - openEuler
  - Kylin Linux Advanced Server

##################
# Runtime Options
##################
# Kubernetes CRI 仅支持 containerd（docker 作为 CRI 已移除）
# runtime containerd version
containerd_release: ""

# 自定义 containerd 数据存放目录
containerd_data_dir: "{{ runtime_data_dir }}"

######################
# Certificate Options
######################
enable_certificate_period: "no"
certificate_validity_period: ""
ca_certificate_validity_period: ""

#####################
# keepalived options
#####################
# Arbitrary unique number from 0..255
#keepalived_virtual_router_id: "68"

#############################
# Pixiu-localstorage Options
#############################
#enable_pixiu_localstorage: "no"

###############
# Helm Options
###############
#enable_helm: "yes"

# v3.5.2 and v3.9.0 is available, default is v3.9.0
#helm_release: v3.9.0
#helm_image: "ccr.ccs.tencentyun.com/pixiucloud/helm-toolbox:{{ helm_release }}"

########################
# Elasticsearch Options
########################
# The Fluentd, elasticsearch, and kibana will be installed when enabled.
#enable_elasticsearch: "no"
#elasticsearch_name: elasticsearch
#elasticsearch_namespace: "{{ kubez_namespace }}"
#elasticsearch_chart_version: 8.5.1

# 生产环境推荐 3 副本
#elasticsearch_replicas: 1
# 生产环境至少为 2 节点
#minimum_master_nodes: 1

###################
# Filebeat Options
###################
#enable_filebeat: "no"
#filebeat_name: filebeat
#filebeat_namespace: "{{ kubez_namespace }}"
#filebeat_chart_version: 8.5.1

#################
# Kibana Options
#################
#enable_kibana: "no"
#kibana_name: kibana
#kibana_namespace: "{{ kubez_namespace }}"
#kibana_chart_version: 8.5.1
#kibana_replicas: 1

##################
# Fluentd Options
##################
#enable_fluentd: "no"
#fluentd_name: fluentd
#fluentd_namespace: "{{ kubez_namespace }}"
#fluentd_chart_version: 0.3.9

#########################
# metrics-scraper Options
#########################
#enable_metrics_scraper: "yes"

###########################
# pixiu-autoscaler Options
###########################
#enable_pixiu_autoscaler: "yes"

#######################
# Metrics Server Options
#######################
#enable_metrics_server: "yes"
