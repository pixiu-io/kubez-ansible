name: Publish pixiu-dev-server image

on:
  push:
    branches:
      - "master"
    paths-ignore:
      - 'docs/**'
      - 'cmd/cluster-agent/**'
      - 'docker/Dockerfile-cluster-agent'
      - 'docker/Dockerfile-toolbox'
      - 'deploy/agent/**'
      - '.github/workflows/build-cluster-agent-image.yml'
      - '.github/workflows/build-toolbox-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Checkout pixiu-ui
        uses: actions/checkout@v3
        with:
          repository: pixiu-io/pixiu-ui
          ref: master
          # GITHUB_TOKEN 无法访问其他私有仓库，需配置有 pixiu-ui 读权限的 PAT
          token: ${{ secrets.PIXIU_UI_TOKEN }}
          path: pixiu-ui

      - name: Get short commit hash
        run: |
          echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV

      # 只构建 amd64，无需 QEMU（runner 本身即 amd64）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login harbor
        uses: docker/login-action@v3
        with:
          registry: crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.DOCKER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the amd64 pixiu image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=${{ env.COMMIT_HASH }}-${{ env.TIMESTAMP }}
          push: true
          provenance: false
          sbom: false
          tags: |
            crpi-0ecikjs9ylb2hqyo.cn-hangzhou.personal.cr.aliyuncs.com/pixiu-public/pixiu:latest
