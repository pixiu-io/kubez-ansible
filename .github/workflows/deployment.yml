---
name: deployment

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  k8s-deployemnt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: setup env
        run: bash tools/setup_env.sh

      - name: test kubez-ansible installed
        run: kubez-ansible
